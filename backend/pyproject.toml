[project]
name = "ulysse"
version = "0.1.0"
description = "ULYSSE — simulated investing app with an embedded, self-explaining agent (Datathon AlphaForge AI 2026). Simulation only, not financial advice."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# curl_cffi >= 0.12 (required by yfinance >= 1.0) fails to resolve host names on some Windows machines
# ("Resolving timed out"); this pair downloads correctly on Windows, macOS and Linux.
data = ["pandas>=2.2", "yfinance>=0.2.50,<0.3", "curl_cffi>=0.10,<0.12", "openpyxl>=3.1"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
aws = ["boto3>=1.35", "anthropic[bedrock]>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ulysse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
markers = ["network: test needs internet (skipped by default)", "datapack: test needs the built datapack"]
